<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1012">
<title>Margin</title>
<style>
:root{
  --bg:#f6f6f4;--card:#fff;--ink:#141414;--mute:#7a7a76;--line:#e7e7e3;
  --acc:#2f7d5b;--acc-soft:#e3f0ea;--warn:#b5482f;--warn-soft:#f7e4de;--amber:#c08a1e;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1012;--card:#18191c;--ink:#ecece8;--mute:#8b8b86;--line:#26272b;
  --acc:#5cc493;--acc-soft:#18302a;--warn:#ec7a5f;--warn-soft:#3a201a;--amber:#e0b04a;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 92px);
  max-width:560px;margin:0 auto;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 18px}
header h1{font-size:17px;font-weight:650;letter-spacing:-.01em}
header .sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--acc)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.icon-btn:active{background:var(--line)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--line)}
.label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0 4px}
.mid{font-size:26px;font-weight:700;letter-spacing:-.02em}
.neg{color:var(--warn)}
.pos{color:var(--acc)}
.sub{color:var(--mute);font-size:14px}
.pace{position:relative;height:8px;border-radius:4px;background:var(--line);margin:16px 0 8px;overflow:visible}
.pace .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--acc);max-width:100%}
.pace .fill.over{background:var(--warn)}
.pace .tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px;opacity:.55}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--mute);font-size:13px}
.row .v{font-weight:600;white-space:nowrap;text-align:right}
.row.tap{cursor:pointer}
.row.tap:active{opacity:.6}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.sec h2{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.add{color:var(--acc);font-weight:600;font-size:14px;padding:4px 0}
.total{display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);font-weight:650}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
.quick input:focus{border-color:var(--acc)}
.quick input.amt{flex:0 0 108px;font-weight:600}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px 18px;font-weight:650}
@media (prefers-color-scheme:dark){.btn{color:#0f1012}}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 10px;background:var(--line)}
.stack div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.prog{height:6px;border-radius:3px;background:var(--line);margin:10px 0 8px;overflow:hidden}
.prog div{height:100%;background:var(--acc);border-radius:3px}
.goal{cursor:pointer}
.goal:active{opacity:.7}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .t{font-weight:600}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.note b{color:var(--ink);font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.empty{color:var(--mute);font-size:14px;padding:6px 0;line-height:1.5}
svg.chart{width:100%;height:150px;display:block;margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
.field textarea{min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace}
.field input:focus,.field select:focus{border-color:var(--acc)}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.pills{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Margin</h1>
  <div style="display:flex;align-items:center;gap:6px">
    <span class="sync"><span class="dot" id="dot"></span><span id="syncText">Local</span></span>
    <button class="icon-btn" id="gear" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="view"></main>

<nav><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-tab="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Grow</button>
</div></nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',minimumFractionDigits:2,maximumFractionDigits:2});
const money = (n, cents) => (cents ? nf2 : nf0).format(Math.round((n||0)*100)/100);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const clone = o => JSON.parse(JSON.stringify(o));
const FREQ = {
  week:{l:'Weekly',m:52/12}, fortnight:{l:'Fortnightly',m:26/12}, month:{l:'Monthly',m:1},
  quarter:{l:'Quarterly',m:1/3}, year:{l:'Yearly',m:1/12}
};
const perMonth = it => num(it.amount) * (FREQ[it.freq]?.m ?? 1);

/* ---------- state ---------- */
const KEY = 'margin.v1';
function defaults(){
  return {
    v:1, updated:0,
    income:[{id:uid(),name:'Salary (after tax)',amount:4400,freq:'month'}],
    bills:[
      {id:uid(),name:'Rent',amount:600,freq:'month'},
      {id:uid(),name:'Groceries',amount:250,freq:'month'},
      {id:uid(),name:'Fuel & transport',amount:250,freq:'month'},
      {id:uid(),name:'Insurance',amount:87,freq:'month'},
      {id:uid(),name:'Phone',amount:25,freq:'month'},
      {id:uid(),name:'Subscriptions',amount:15,freq:'month'}
    ],
    accounts:[{id:uid(),name:'Savings (HISA)',balance:0,rate:5.0,contrib:2000}],
    invest:[],
    goals:[{id:uid(),name:'Emergency fund',target:5000,saved:0,date:''}],
    spends:[],
    prefs:{view:'month',horizon:5,tab:'today'}
  };
}
function loadLocal(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(defaults(), JSON.parse(r)); }catch(e){} return null; }
let S = loadLocal() || defaults();
function cacheLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- sync (claude db, private per user) ---------- */
let ref = null, writing = false, dirty = false, timer = null, gotRemote = false;
function setSync(on, text){ $('#dot').classList.toggle('on', on); $('#syncText').textContent = text; }
function save(){
  S.updated = Date.now(); cacheLocal(); render();
  if(!ref) return;
  dirty = true; clearTimeout(timer); timer = setTimeout(flush, 500);
}
async function flush(){
  if(!ref || writing || !dirty) return;
  writing = true; dirty = false;
  try{ await ref.set({updated:S.updated, state:clone(S)}); setSync(true,'Synced'); }
  catch(e){ setSync(false, e && e.code==='quota_exceeded' ? 'Storage full' : 'Offline'); }
  writing = false;
  if(dirty) flush();
}
(async function initSync(){
  try{
    if(!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync(false,'Local'); return; }
    ref = db.doc('data/users/' + id + '/margin');
    setSync(false,'Syncing…');
    const slow = setTimeout(()=>{ if(!gotRemote) setSync(false,'Offline'); }, 10000);
    ref.onSnapshot(snap => {
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        const d = snap.data();
        if(d && d.state && (d.updated||0) > (S.updated||0)){
          const tab = S.prefs.tab;
          S = Object.assign(defaults(), clone(d.state)); S.prefs.tab = tab;
          cacheLocal(); render();
        } else if(d && (d.updated||0) < (S.updated||0) && !snap.metadata.fromCache){
          dirty = true; flush();
        }
      } else if(!snap.metadata.fromCache && !gotRemote){
        dirty = true; flush();
      }
      if(!snap.metadata.fromCache){ gotRemote = true; clearTimeout(slow); setSync(true,'Synced'); }
    }, () => { clearTimeout(slow); setSync(false,'Local'); ref = null; });
  }catch(e){ setSync(false,'Local'); }
})();

/* ---------- maths ---------- */
function calc(){
  const incomeM = S.income.reduce((a,i)=>a+perMonth(i),0);
  const billsM = S.bills.reduce((a,i)=>a+perMonth(i),0);
  const saveM = S.accounts.reduce((a,i)=>a+num(i.contrib),0) + S.invest.reduce((a,i)=>a+num(i.contrib),0);
  const freeM = incomeM - billsM - saveM;
  const now = new Date(), key = iso(now).slice(0,7);
  const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const day = now.getDate();
  const spent = S.spends.filter(s=>String(s.date).slice(0,7)===key).reduce((a,s)=>a+num(s.amt),0);
  const left = freeM - spent;
  const daysLeft = dim - day + 1;
  return {incomeM,billsM,saveM,freeM,spent,left,dim,day,daysLeft,key,
    perDay: left/daysLeft, elapsed:(day-1+now.getHours()/24)/dim};
}
function project(months){
  const pts=[], put=[];
  let accs = S.accounts.map(a=>({b:num(a.balance),r:num(a.rate)/100/12,c:num(a.contrib)}));
  let inv = S.invest.map(a=>({b:num(a.value),r:num(a.ret)/100/12,c:num(a.contrib)}));
  const all = accs.concat(inv);
  let contributed = all.reduce((t,x)=>t+x.b,0);
  pts.push(contributed); put.push(contributed);
  for(let m=1;m<=months;m++){
    all.forEach(x=>{ x.b = x.b*(1+x.r) + x.c; contributed += x.c; });
    pts.push(all.reduce((t,x)=>t+x.b,0)); put.push(contributed);
  }
  return {pts,put};
}
function monthsUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00'), n = new Date();
  return Math.max(1, (d.getFullYear()-n.getFullYear())*12 + (d.getMonth()-n.getMonth()));
}

/* ---------- views ---------- */
const views = {
today(){
  const c = calc();
  const vf = S.prefs.view==='week';
  const pct = c.freeM>0 ? Math.min(100, c.spent/c.freeM*100) : 100;
  const ahead = c.freeM>0 && c.spent/c.freeM > c.elapsed + 0.05;
  const monthName = new Date().toLocaleString('en-AU',{month:'long'});
  const list = S.spends.filter(s=>String(s.date).slice(0,7)===c.key).sort((a,b)=>b.date.localeCompare(a.date)||0);
  return `
  <section class="card">
    <div class="label">Yours to spend · ${monthName}</div>
    <div class="big ${c.left<0?'neg':''}">${money(c.left)}</div>
    <div class="sub">${c.left>0 ? `≈ ${money(c.perDay)}/day · ${money(c.perDay*7)}/week · ${c.daysLeft} day${c.daysLeft>1?'s':''} left` : `Over by ${money(-c.left)} this month`}</div>
    <div class="pace"><div class="fill ${c.spent>c.freeM?'over':''}" style="width:${pct}%"></div><div class="tick" style="left:calc(${(c.elapsed*100).toFixed(1)}% - 1px)"></div></div>
    <div class="sub" style="font-size:13px">${money(c.spent)} of ${money(c.freeM)} · ${c.freeM<=0?'Plan is over-committed':ahead?'Spending faster than the month':'On pace'}</div>
  </section>
  <form class="quick" id="quick" autocomplete="off">
    <input class="amt" id="qAmt" inputmode="decimal" placeholder="$0">
    <input id="qNote" placeholder="What for? (optional)">
    <button class="btn" type="submit">Add</button>
  </form>
  <div class="sec"><h2>This month</h2><span class="sub" style="font-size:12px">${list.length} entr${list.length===1?'y':'ies'}</span></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">
    ${list.length ? list.map(s=>`
      <div class="row tap" data-edit="spends" data-id="${s.id}">
        <div style="min-width:0"><div class="n">${esc(s.note)||'Spend'}</div><div class="m">${new Date(s.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</div></div>
        <div class="v">${money(s.amt,true)}</div>
      </div>`).join('') : `<div class="empty">Only log the optional stuff here — food out, shopping, nights out. Bills and savings are already taken care of in your plan.</div>`}
  </section>`;
},
plan(){
  const c = calc();
  const vf = S.prefs.view==='week', f = vf ? 12/52 : 1, u = vf ? '/wk' : '/mo';
  const tot = Math.max(c.incomeM, c.billsM + c.saveM + Math.max(0,c.freeM));
  const w = x => (Math.max(0,x)/tot*100).toFixed(2)+'%';
  const rows = (kind, arr) => arr.length ? arr.map(i=>`
    <div class="row tap" data-edit="${kind}" data-id="${i.id}">
      <div style="min-width:0"><div class="n">${esc(i.name)}</div><div class="m">${money(i.amount,num(i.amount)%1!==0)} ${FREQ[i.freq].l.toLowerCase()}</div></div>
      <div class="v">${money(perMonth(i)*f)}</div>
    </div>`).join('') : `<div class="empty">Nothing yet.</div>`;
  const saveRows = S.accounts.map(a=>({n:a.name,c:a.contrib,k:'accounts',id:a.id})).concat(S.invest.map(a=>({n:a.name,c:a.contrib,k:'invest',id:a.id})))
    .filter(x=>num(x.c)>0);
  return `
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="label">Left for you</div><div class="big ${c.freeM<0?'neg':''}">${money(c.freeM*f)}<span class="sub" style="font-size:16px;font-weight:500"> ${u}</span></div></div>
      <div class="seg"><button data-view="week" class="${vf?'on':''}">Week</button><button data-view="month" class="${!vf?'on':''}">Month</button></div>
    </div>
    <div class="stack"><div style="width:${w(c.billsM)};background:var(--mute)"></div><div style="width:${w(c.saveM)};background:var(--acc)"></div><div style="width:${w(c.freeM)};background:var(--amber)"></div></div>
    <div class="legend"><span><i style="background:var(--mute)"></i>Fixed ${money(c.billsM*f)}</span><span><i style="background:var(--acc)"></i>Saving ${money(c.saveM*f)}</span><span><i style="background:var(--amber)"></i>Yours ${money(Math.max(0,c.freeM)*f)}</span></div>
    ${c.freeM<0?`<div class="warnbox">Your fixed costs and savings add up to ${money(-c.freeM*f)} more than you earn${u}.</div>`:''}
  </section>
  <div class="sec"><h2>Income</h2><button class="add" data-add="income">+ Add</button></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">${rows('income',S.income)}<div class="total" style="margin-bottom:10px"><span>Total</span><span>${money(c.incomeM*f)}${u}</span></div></section>
  <div class="sec"><h2>Fixed costs</h2><button class="add" data-add="bills">+ Add</button></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">${rows('bills',S.bills)}<div class="total" style="margin-bottom:10px"><span>Total</span><span>${money(c.billsM*f)}${u}</span></div></section>
  <div class="sec"><h2>Saving &amp; investing</h2><button class="add" data-goto="grow">Edit in Grow</button></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">
    ${saveRows.length ? saveRows.map(x=>`<div class="row tap" data-edit="${x.k}" data-id="${x.id}"><div class="n">${esc(x.n)}</div><div class="v">${money(num(x.c)*f)}</div></div>`).join('') : `<div class="empty">No regular deposits set.</div>`}
    <div class="total" style="margin-bottom:10px"><span>Total</span><span>${money(c.saveM*f)}${u}</span></div>
  </section>
  <p class="note" style="margin:14px 4px">Yearly or quarterly bills (rego, annual insurance) can go in Fixed costs with their real frequency — Margin spreads them out per month so they never catch you off guard.</p>`;
},
goals(){
  const c = calc();
  const need = S.goals.reduce((a,g)=>{ const m = monthsUntil(g.date); const r = Math.max(0,num(g.target)-num(g.saved)); return a + (m ? r/m : 0); },0);
  return `
  <section class="card">
    <div class="label">Goals need</div>
    <div class="big">${money(need)}<span class="sub" style="font-size:16px;font-weight:500"> /mo</span></div>
    <div class="sub">You're putting away ${money(c.saveM)}/mo · ${need<=c.saveM ? '<span class="pos">covered</span>' : `<span class="neg">${money(need-c.saveM)} short</span>`}</div>
    <p class="note" style="margin-top:8px">Only goals with a target date count toward this.</p>
  </section>
  <div class="sec"><h2>Goals</h2><button class="add" data-add="goals">+ Add</button></div>
  ${S.goals.length ? S.goals.map(g=>{
    const t=num(g.target), s=num(g.saved), p = t>0?Math.min(100,s/t*100):0, m = monthsUntil(g.date), r=Math.max(0,t-s);
    const when = g.date ? new Date(g.date+'T00:00:00').toLocaleDateString('en-AU',{month:'short',year:'numeric'}) : 'No date';
    return `<section class="card goal" data-edit="goals" data-id="${g.id}">
      <div class="top"><span class="t">${esc(g.name)}</span><span class="sub" style="font-size:13px">${when}</span></div>
      <div class="prog"><div style="width:${p}%"></div></div>
      <div class="top"><span class="sub" style="font-size:13px">${money(s)} of ${money(t)} · ${Math.round(p)}%</span>
      <span style="font-size:13px;font-weight:600">${r<=0?'<span class="pos">Done ✓</span>':m?`${money(r/m)}/mo`:`${money(r)} to go`}</span></div>
    </section>`;}).join('') : `<section class="card"><div class="empty">No goals yet.</div></section>`}`;
},
grow(){
  const H = S.prefs.horizon, months = H*12;
  const {pts,put} = project(months);
  const end = pts[pts.length-1], putEnd = put[put.length-1], gain = end - putEnd;
  const now = S.accounts.reduce((a,x)=>a+num(x.balance),0) + S.invest.reduce((a,x)=>a+num(x.value),0);
  const W=320,Hh=140,max=Math.max(1,...pts);
  const line = arr => arr.map((v,i)=>`${(i/months*W).toFixed(1)},${(Hh-4-(v/max)*(Hh-12)).toFixed(1)}`).join(' ');
  const yr = new Date().getFullYear();
  return `
  <section class="card">
    <div class="label">In ${H} year${H>1?'s':''} if you stick to the plan</div>
    <div class="big pos">${money(end)}</div>
    <div class="sub">${money(putEnd)} you put in · <b style="color:var(--ink)">${money(gain)}</b> interest &amp; growth</div>
    <svg class="chart" viewBox="0 0 ${W} ${Hh+14}" preserveAspectRatio="none">
      <polyline points="${line(put)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <polyline points="${line(pts)}" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <text x="0" y="${Hh+12}" font-size="10" fill="var(--mute)">${yr}</text>
      <text x="${W}" y="${Hh+12}" font-size="10" fill="var(--mute)" text-anchor="end">${yr+H}</text>
    </svg>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <div class="legend"><span><i style="background:var(--acc)"></i>With interest</span><span><i style="background:var(--mute)"></i>Deposits only</span></div>
      <div class="seg">${[1,3,5,10].map(y=>`<button data-h="${y}" class="${y===H?'on':''}">${y}y</button>`).join('')}</div>
    </div>
  </section>
  <div class="sec"><h2>Accounts</h2><button class="add" data-add="accounts">+ Add</button></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">
    ${S.accounts.length ? S.accounts.map(a=>`
      <div class="row tap" data-edit="accounts" data-id="${a.id}">
        <div style="min-width:0"><div class="n">${esc(a.name)}</div><div class="m">${num(a.rate).toFixed(2)}% p.a. · +${money(a.contrib)}/mo · earns ≈ ${money(num(a.balance)*num(a.rate)/100/12)}/mo</div></div>
        <div class="v">${money(a.balance)}</div>
      </div>`).join('') : `<div class="empty">Add a savings account with its interest rate.</div>`}
  </section>
  <div class="sec"><h2>Investments</h2><button class="add" data-add="invest">+ Add</button></div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">
    ${S.invest.length ? S.invest.map(a=>`
      <div class="row tap" data-edit="invest" data-id="${a.id}">
        <div style="min-width:0"><div class="n">${esc(a.name)}</div><div class="m">assumes ${num(a.ret).toFixed(1)}% p.a. · +${money(a.contrib)}/mo</div></div>
        <div class="v">${money(a.value)}</div>
      </div>`).join('') : `<div class="empty">Nothing invested yet. Add a holding (e.g. a diversified ETF) with an assumed yearly return to see it in the projection. Returns aren't guaranteed and can go backwards.</div>`}
  </section>
  <section class="card" style="margin-top:12px"><div class="top" style="display:flex;justify-content:space-between"><span class="label">Net worth today</span><span class="mid">${money(now)}</span></div></section>`;
}
};

/* ---------- sheets ---------- */
const SCHEMA = {
  income:{t:'Income',f:[['name','Name','text'],['amount','Amount','num'],['freq','How often','freq']]},
  bills:{t:'Fixed cost',f:[['name','Name','text'],['amount','Amount','num'],['freq','How often','freq']]},
  accounts:{t:'Account',f:[['name','Name','text'],['balance','Current balance','num'],['rate','Interest rate (% p.a.)','num'],['contrib','Deposit each month','num']]},
  invest:{t:'Investment',f:[['name','Name / ticker','text'],['value','Current value','num'],['ret','Assumed return (% p.a.)','num'],['contrib','Contribution each month','num']]},
  goals:{t:'Goal',f:[['name','Goal','text'],['target','Target amount','num'],['saved','Saved so far','num'],['date','Target date (optional)','date']]},
  spends:{t:'Spend',f:[['amt','Amount','num'],['note','Note','text'],['date','Date','date']]}
};
const BLANK = {
  income:()=>({name:'',amount:'',freq:'month'}), bills:()=>({name:'',amount:'',freq:'month'}),
  accounts:()=>({name:'',balance:'',rate:'',contrib:''}), invest:()=>({name:'',value:'',ret:7,contrib:''}),
  goals:()=>({name:'',target:'',saved:'',date:''}), spends:()=>({amt:'',note:'',date:iso(new Date())})
};
function openSheet(kind, id){
  const sc = SCHEMA[kind], it = id ? S[kind].find(x=>x.id===id) : BLANK[kind]();
  if(!it) return;
  $('#sheet').innerHTML = `<h3>${id?'Edit':'New'} ${sc.t.toLowerCase()}</h3>
  <form id="sf" autocomplete="off">
  ${sc.f.map(([k,l,t])=>`<div class="field"><label>${l}</label>${
    t==='freq' ? `<select name="${k}">${Object.entries(FREQ).map(([v,o])=>`<option value="${v}" ${it[k]===v?'selected':''}>${o.l}</option>`).join('')}</select>`
    : `<input name="${k}" type="${t==='date'?'date':'text'}" ${t==='num'?'inputmode="decimal"':''} value="${esc(it[k])}">`}</div>`).join('')}
  <div class="actions">${id?`<button type="button" class="btn danger" id="del">Delete</button>`:''}<button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" type="submit">Save</button></div>
  </form>`;
  $('#scrim').classList.add('open');
  const first = $('#sf input'); if(first && !id) setTimeout(()=>first.focus(),50);
  $('#cancel').onclick = closeSheet;
  if(id) $('#del').onclick = () => { S[kind] = S[kind].filter(x=>x.id!==id); closeSheet(); save(); toast('Deleted'); };
  $('#sf').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target), o = id ? it : {id:uid()};
    sc.f.forEach(([k,,t])=>{ const v = fd.get(k); o[k] = t==='num' ? num(v) : String(v||'').trim(); });
    if(!o.name && 'name' in BLANK[kind]()) o.name = 'Untitled';
    if(kind==='spends' && !o.date) o.date = iso(new Date());
    if(!id) S[kind].push(o);
    closeSheet(); save();
  };
}
function closeSheet(){ $('#scrim').classList.remove('open'); }
$('#scrim').addEventListener('click', e => { if(e.target.id==='scrim') closeSheet(); });

function openSettings(){
  $('#sheet').innerHTML = `<h3>Backup &amp; data</h3>
  <p class="note" style="margin-bottom:14px">${ref ? 'Your data syncs privately to your Claude account — only you can see it.' : 'Your data is saved in this browser only.'} Copy a backup now and then; paste one back in to restore.</p>
  <div class="field"><label>Backup (JSON)</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea></div>
  <div class="actions"><button class="btn ghost" id="cp">Copy</button><button class="btn" id="rs">Restore from box</button></div>
  <div class="actions"><button class="btn danger" id="clr">Clear this month's spends</button></div>
  <div class="actions"><button class="btn ghost" id="cl">Close</button></div>`;
  $('#scrim').classList.add('open');
  $('#cl').onclick = closeSheet;
  $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText($('#bk').value); toast('Copied'); }catch(e){ $('#bk').select(); toast('Select all & copy'); } };
  $('#rs').onclick = () => {
    try{ const d = JSON.parse($('#bk').value); if(!d || !Array.isArray(d.income)) throw 0;
      const tab = S.prefs.tab; S = Object.assign(defaults(), d); S.prefs.tab = tab; closeSheet(); save(); toast('Restored');
    }catch(e){ toast("That doesn't look like a Margin backup"); }
  };
  let armed = false;
  $('#clr').onclick = e => {
    if(!armed){ armed = true; e.target.textContent = 'Tap again to confirm'; return; }
    const k = iso(new Date()).slice(0,7); S.spends = S.spends.filter(s=>String(s.date).slice(0,7)!==k); closeSheet(); save(); toast('Cleared');
  };
}
$('#gear').onclick = openSettings;

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- render & events ---------- */
function render(){
  const tab = S.prefs.tab in views ? S.prefs.tab : 'today';
  $('#view').innerHTML = views[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  const q = $('#quick');
  if(q) q.onsubmit = e => {
    e.preventDefault();
    const a = num($('#qAmt').value); if(!a){ $('#qAmt').focus(); return; }
    S.spends.push({id:uid(),amt:a,note:$('#qNote').value.trim(),date:iso(new Date())});
    save(); toast(`${money(a,true)} logged`);
  };
}
function go(tab){ S.prefs.tab = tab; cacheLocal(); render(); scrollTo(0,0); }
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-edit],[data-add],[data-view],[data-h],[data-goto]'); if(!t) return;
  if(t.dataset.edit) openSheet(t.dataset.edit, t.dataset.id);
  else if(t.dataset.add) openSheet(t.dataset.add);
  else if(t.dataset.view){ S.prefs.view = t.dataset.view; save(); }
  else if(t.dataset.h){ S.prefs.horizon = +t.dataset.h; save(); }
  else if(t.dataset.goto) go(t.dataset.goto);
});
render();
</script>
</body>
</html>
